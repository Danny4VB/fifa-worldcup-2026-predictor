<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FIFA WorldCup 2026 Predictor — Download App</title>
  <meta name="description" content="Download the Match Predict 2026 app and share match picks with fans." />
  <meta property="og:title" content="Match Predict 2026" />
  <meta property="og:description" content="Predict matches, pick your champion, and compare with fans." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0b1628" />
  <style>
    :root {
      --bg: #0b1628;
      --card: #111f35;
      --gold: #ffc326;
      --blue: #38bdf8;
      --text: #f8fafc;
      --muted: #a8b3c7;
      --green: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.22), transparent 34%),
        radial-gradient(circle at bottom right, rgba(255,195,38,.18), transparent 34%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      background: rgba(17,31,53,.92);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      padding: 34px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      text-align: center;
    }
    .logo {
      width: min(260px, 70vw);
      height: auto;
      max-height: 260px;
      border-radius: 28px;
      margin: 0 auto 22px;
      background: transparent;
      display: block;
      object-fit: contain;
      padding: 0;
      filter: drop-shadow(0 18px 36px rgba(0,0,0,.35));
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.05;
    }
    p {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
      margin: 16px auto 0;
      max-width: 560px;
    }
    .status {
      margin: 18px auto 0;
      color: var(--gold);
      font-weight: 800;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 28px;
    }
    a.button {
      display: block;
      text-decoration: none;
      color: #07111f;
      font-weight: 900;
      padding: 18px 16px;
      border-radius: 18px;
      background: var(--gold);
      font-size: 18px;
    }
    a.button.secondary {
      background: var(--blue);
    }
    .small {
      margin-top: 22px;
      font-size: 14px;
      color: var(--muted);
    }
    @media (max-width: 560px) {
      .buttons { grid-template-columns: 1fr; }
      .card { padding: 26px 18px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/app-logo.png" alt="FIFA WorldCup 2026 Predictor app logo" />
    <h1>FIFA WorldCup 2026 Predictor</h1>
    <p>Predict matches, pick your champion, compare with fans, and share your World Cup predictions.</p>
    <div id="status" class="status">Checking your device...</div>

    <div class="buttons">
      <a id="iosLink" class="button" href="#ios-coming-soon" rel="noopener">App Store Coming Soon</a>
      <a id="androidLink" class="button secondary" href="https://play.google.com/store/apps/details?id=com.virtualbeehive.fifaworldcup2026predictor&pcampaignid=web_share" rel="noopener">Get it on Google Play</a>
    </div>

    <div class="small">If you are not redirected automatically, choose your app store above.</div>
  </main>

  <script>
    const GOOGLE_PLAY_URL = "https://play.google.com/store/apps/details?id=com.virtualbeehive.fifaworldcup2026predictor&pcampaignid=web_share";

    /*
      Replace this after Apple approval with the real App Store URL.
      Example:
      https://apps.apple.com/us/app/fifa-worldcup-2026-predictor/id1234567890
    */
    const APPLE_APP_STORE_URL = "#ios-coming-soon";

    const ua = navigator.userAgent || navigator.vendor || window.opera || "";
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(ua);

    document.getElementById("iosLink").href = APPLE_APP_STORE_URL;
    document.getElementById("androidLink").href = GOOGLE_PLAY_URL;

    const status = document.getElementById("status");

    setTimeout(() => {
      if (isAndroid) {
        status.textContent = "Opening Google Play...";
        window.location.href = GOOGLE_PLAY_URL;
        return;
      }

      if (isIOS) {
        status.textContent = "The iPhone version is coming soon.";
        return;
      }

      status.textContent = "Choose your app store below.";
    }, 800);
  </script>
</body>
</html>
